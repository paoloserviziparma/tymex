# Pubblicazione automatica degli articoli programmati del blog.
# Ogni martedì alle 9:00 (ora italiana in inverno; 10:00 con l'ora legale) rigenera il sito:
# se è arrivata la data di un nuovo articolo, salva il risultato su main e Netlify lo pubblica.
# Se non ci sono novità non fa nulla (nessuna pubblicazione, nessun credito Netlify consumato).
name: Pubblicazione programmata del blog

on:
  schedule:
    - cron: "0 8 * * 2"   # martedì 08:00 UTC
  workflow_dispatch:        # avvio manuale da GitHub → Actions → Run workflow

permissions:
  contents: write

concurrency:
  group: pubblica-blog
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Genera il sito
        run: python3 src/build.py

      - name: Pubblica se ci sono nuovi articoli
        run: |
          if [ -z "$(git status --porcelain public)" ]; then
            echo "Nessun nuovo articolo da pubblicare oggi."
            exit 0
          fi
          git config user.name "Pubblicazione automatica Tymex"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public
          git commit -m "Blog: pubblicazione programmata del $(TZ=Europe/Rome date +%d/%m/%Y)"
          git push
