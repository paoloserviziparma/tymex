# Sito statico: Netlify pubblica la cartella public/ senza comandi di build.
[build]
  publish = "public"
  command = ""

# ---------------------------------------------------------------- Redirect dal vecchio sito Wix (301)
# Gli indirizzi rimasti uguali (es. /privacy -> /privacy/) li gestisce Netlify da solo.
[[redirects]]
  from = "/contact-9"
  to = "/#contatti"
  status = 301
[[redirects]]
  from = "/about"
  to = "/chi-siamo/"
  status = 301
[[redirects]]
  from = "/resources"
  to = "/blog/"
  status = 301
[[redirects]]
  from = "/support"
  to = "/supporto/"
  status = 301
[[redirects]]
  from = "/copia-di-manuale-utente"
  to = "/condizioni-generali/"
  status = 301
[[redirects]]
  from = "/copia-di-privacy"
  to = "/cookie-policy/"
  status = 301
[[redirects]]
  from = "/post/timesheet-excel-vantaggi-limiti-alternative"
  to = "/blog/timesheet-excel-vantaggi-limiti-alternative/"
  status = 301
[[redirects]]
  from = "/post/come-calcolare-la-marginalita-di-una-commessa"
  to = "/blog/come-calcolare-la-marginalita-di-una-commessa/"
  status = 301
[[redirects]]
  from = "/post/*"
  to = "/blog/"
  status = 301
[[redirects]]
  from = "/blog/categories/*"
  to = "/blog/"
  status = 301
